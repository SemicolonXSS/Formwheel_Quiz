<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Identity Quiz · Formwheel</title><link rel="icon" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg"><style>:root{font:16px system-ui;color:#f5f3ff;background:#151329}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:40px auto;padding:20px}.card{background:#24213f;border:1px solid #61538a;border-radius:20px;padding:25px}h1{font-size:32px;letter-spacing:2px}a{color:#cab6ff}button{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;background:#7963da;color:white}button:focus-visible{outline:3px solid #53d4f4}.choices{display:grid;gap:10px}.choices button{text-align:left;background:#39325b}.choices button:hover{background:#5c4b94}.muted{color:#d0c8ea}.notice{margin:16px 0;padding:12px;background:#342a50;border-radius:10px}</style></head><body><main><a href="./index.html">← Quiz로 돌아가기</a><article class="card"><p class="muted">FORMWHEEL · ORBIT IDENTITY</p><h1 id="title"></h1><p id="desc" class="muted"></p><div id="play"></div></article></main><script>
const banks={
ECHO:{desc:'기억과 반복 · 메아리의 시험',qs:[['메아리(Echo)가 생기는 가장 큰 이유는?',['빛의 굴절','소리의 반사','자기장','열의 이동'],1],['순서 기억: 별, 달, 별, 해 다음에 세 번째로 나온 것은?',['달','해','별','구름'],2],['2, 4, 8, 16, 다음 수는?',['20','24','32','64'],2],['ECHO의 글자 수는?',['3','4','5','6'],1]]},
NOVA:{desc:'도전과 성장 · 별의 시험',qs:[['Nova는 천문학에서 무엇과 관련 있을까?',['별의 밝기 변화','해류','암석','바람'],0],['9 × 7 = ?',['56','63','72','81'],1],['빛이 1초 동안 이동하는 거리에 가장 가까운 값은?',['약 300km','약 3만km','약 30만km','약 300만km'],2],['12의 제곱은?',['124','144','132','142'],1]]},
VOID:{desc:'미지와 탐험 · 공허의 시험',qs:[['VOID의 일반적인 뜻은?',['숲','공허','빛','바다'],1],['서로 다른 숫자 1,2,3을 나열하는 경우의 수는?',['3','6','8','9'],1],['규칙: 1, 1, 2, 3, 5 다음 수는?',['6','7','8','10'],2],['진공에서 소리는 어떻게 될까?',['더 빨라진다','전달되지 않는다','더 커진다','색으로 바뀐다'],1]]},
RIFT:{desc:'변화와 발견 · 균열의 시험',qs:[['RIFT의 뜻과 가까운 것은?',['균열','메아리','별','중심'],0],['2 + 3 × 4 = ?',['20','14','24','16'],1],['정사각형을 대각선 하나로 나누면 삼각형은 몇 개?',['1','2','3','4'],1],['다음 중 다른 하나는?',['원','삼각형','사각형','오각형'],0]]}};
const id=new URLSearchParams(location.search).get('identity')?.toUpperCase();const data=banks[id];let index=0,score=0;
document.getElementById('title').textContent=data?id:'잘못된 Identity';
document.getElementById('desc').textContent=data?data.desc:'ECHO, NOVA, VOID, RIFT 중 하나를 선택하세요.';
const play=document.getElementById('play');
function render(){play.replaceChildren();if(!data){const a=document.createElement('a');a.href='./index.html';a.textContent='Quiz 참가 화면으로 돌아가기';play.append(a);return}if(index>=data.qs.length){const h=document.createElement('h2');h.textContent='완료! '+score+' / '+data.qs.length+' 정답';const p=document.createElement('p');p.className='notice';p.textContent='특별 퀴즈 체험 기록입니다. AQS XP 및 업적은 아직 지급되지 않아요.';const b=document.createElement('button');b.textContent='다시 도전';b.onclick=()=>{index=0;score=0;render()};play.append(h,p,b);return}const q=data.qs[index],h=document.createElement('h2');h.textContent='문제 '+(index+1)+' / '+data.qs.length+' · '+q[0];const box=document.createElement('div');box.className='choices';q[1].forEach((answer,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+answer;b.onclick=()=>{if(i===q[2])score++;index++;render()};box.append(b)});play.append(h,box)}render();</script></body></html>
