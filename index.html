<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FormWheel — Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F7FB;
    --surface: #FFFFFF;
    --surface-2: #F1F1F8;
    --border: #E6E6F0;
    --text: #18181B;
    --muted: #71717A;
    --accent: #4F46E5;
    --accent-soft: #EEF0FF;

    --c-a: #FF6B6B;
    --c-b: #22B8CF;
    --c-c: #FFB020;
    --c-d: #7C5CFC;

    --good: #16A34A;
    --bad: #E11D48;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100%;
  }

  #app { min-height: 100vh; display: flex; flex-direction: column; }

  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
  }
  .brand .mark {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 15px;
    flex-shrink: 0;
  }
  .brand .wordmark { font-weight: 700; font-size: 16px; color: var(--text); }
  .brand .tag {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 8px;
    border-radius: 999px;
    margin-left: 2px;
  }
  .nav-meta { font-size: 13px; color: var(--muted); }
  .nav-meta b { color: var(--text); letter-spacing: 1px; }

  main { flex: 1; display: flex; justify-content: center; padding: 28px 18px 48px; }

  .stage { width: 100%; max-width: 460px; display: flex; flex-direction: column; }
  .stage.wide { max-width: 720px; }

  h1.title { font-weight: 800; font-size: 24px; line-height: 1.3; margin: 0 0 6px; }
  p.sub { color: var(--muted); font-size: 14.5px; line-height: 1.6; margin: 0 0 24px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }

  .field { margin-bottom: 16px; }
  label.flabel { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }

  input[type=text], input[type=tel] {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 13px;
    font-size: 15.5px;
    font-family: inherit;
    outline: none;
  }
  input[type=text]:focus, input[type=tel]:focus { border-color: var(--accent); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 10px; padding: 14px 20px;
    font-size: 15.5px; font-weight: 700; font-family: inherit;
    cursor: pointer; width: 100%; color: #fff; background: var(--accent);
    transition: transform .08s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn.ghost { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.small { padding: 10px 14px; font-size: 13.5px; width: auto; }

  .home-choice { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .home-card {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 20px; text-align: left; cursor: pointer; color: var(--text);
  }
  .home-card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .home-card p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .home-card:hover { border-color: var(--accent); background: var(--accent-soft); }

  .draft-card {
    background: var(--accent-soft); border: 1.5px solid var(--accent);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .draft-card .dinfo { flex: 1; min-width: 0; }
  .draft-card .dtitle { font-weight: 700; font-size: 14.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .draft-card .dmeta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .draft-card .dactions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    border: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text);
  }
  .icon-btn.danger { color: var(--bad); }

  .save-status { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: -8px; margin-bottom: 16px; }
  .save-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex-shrink: 0; }
  .save-status.saving .dot { background: var(--c-c); }

  .pin-box {
    background: var(--accent-soft); border: 1.5px dashed var(--accent);
    border-radius: 14px; padding: 24px 20px; text-align: center; margin-bottom: 20px;
  }
  .pin-box .plabel { color: var(--accent); font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
  .pin { font-size: 46px; font-weight: 800; letter-spacing: 6px; color: var(--text); }

  .player-chip {
    display: inline-block; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 14px; margin: 4px; font-size: 13.5px; font-weight: 600;
  }
  .player-wrap { display: flex; flex-wrap: wrap; gap: 0; margin-top: 4px; margin-bottom: 20px; }

  .qtext { font-weight: 800; font-size: 20px; line-height: 1.4; margin: 0 0 18px; }

  .timerbar-track { height: 7px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
  .timerbar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.2s linear; }

  .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; }
  .choice-btn {
    border: none; border-radius: 12px; color: white; font-weight: 700; font-size: 15.5px;
    padding: 20px 12px; min-height: 92px; cursor: pointer; text-align: left; display: flex; align-items: center;
  }
  .choice-btn:active { transform: scale(0.98); }
  .choice-btn.a { background: var(--c-a); }
  .choice-btn.b { background: var(--c-b); }
  .choice-btn.c { background: var(--c-c); }
  .choice-btn.d { background: var(--c-d); }
  .choice-btn:disabled { opacity: .35; cursor: default; }
  .choice-btn.dim { opacity: .25; }
  .choice-btn.picked { outline: 3px solid var(--text); outline-offset: -3px; }

  .center-msg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 40px 0; }
  .center-msg .big { font-size: 38px; }

  .lead-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; background: var(--surface-2); border-radius: 10px; margin-bottom: 8px;
  }
  .lead-row .rank { color: var(--muted); width: 26px; font-weight: 700; }
  .lead-row .name { flex: 1; font-weight: 600; }
  .lead-row .score { font-weight: 800; color: var(--accent); }
  .lead-row.me { border: 1.5px solid var(--accent); }

  .qedit-card { border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: var(--surface-2); }
  .qedit-choice-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .qedit-choice-row input[type=radio] { width: 17px; height: 17px; accent-color: var(--accent); flex-shrink: 0; }
  .qedit-choice-row input[type=text] { flex: 1; }
  .remove-link { background: none; border: none; color: var(--bad); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 0; }

  .seglist { display: flex; gap: 8px; margin-bottom: 4px; }
  .seg-btn {
    flex: 1; padding: 10px; text-align: center; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--muted); cursor: pointer; font-weight: 700;
  }
  .seg-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .errmsg { color: var(--bad); font-size: 13px; margin-top: 10px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .topbar .pinmini { color: var(--muted); font-size: 13.5px; font-weight: 600; }
  .topbar .pinmini b { color: var(--text); letter-spacing: 2px; }

  .bar-row { margin-bottom: 10px; }
  .bar-row .barlabel { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: var(--muted); font-weight: 600; }
  .bar-track { height: 20px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; }

  .footer-actions { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .medal { font-size: 18px; margin-right: 4px; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){

  var FORMWHEEL_HOME = 'https://semicolonxss.github.io/Formwheel/';

  // ---------- Firebase ----------
  var firebaseConfig = {
    apiKey: "AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE",
    authDomain: "formwheel.firebaseapp.com",
    databaseURL: "https://formwheel-default-rtdb.firebaseio.com/",
    projectId: "formwheel",
    storageBucket: "formwheel.firebasestorage.app",
    messagingSenderId: "431583088241",
    appId: "1:431583088241:web:74e0e34ea1e3e1170c55d0"
  };
  var db = null;
  var fbReady = false;
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    fbReady = true;
  }catch(e){
    fbReady = false;
  }

  // ---------- utilities ----------
  function uid(len){
    return Math.random().toString(36).slice(2, 2+len);
  }
  function genPin(){
    return String(Math.floor(1000 + Math.random()*9000));
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      var map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
      return map[c];
    });
  }
  function medalTag(i){
    var m = ['🥇','🥈','🥉'][i];
    return m ? '<span class="medal">' + m + '</span>' : '';
  }
  function timeAgoLabel(ts){
    if(!ts) return '';
    var diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if(diffSec < 60) return '방금 전';
    var diffMin = Math.floor(diffSec / 60);
    if(diffMin < 60) return diffMin + '분 전';
    var diffHr = Math.floor(diffMin / 60);
    if(diffHr < 24) return diffHr + '시간 전';
    var diffDay = Math.floor(diffHr / 24);
    return diffDay + '일 전';
  }

  async function storeGet(key){
    if(!fbReady) return null;
    try{
      var snap = await db.ref('data/' + key).once('value');
      return snap.exists() ? snap.val() : null;
    }catch(e){
      return null;
    }
  }
  async function storeSet(key, val){
    if(!fbReady) return false;
    try{
      await db.ref('data/' + key).set(val);
      return true;
    }catch(e){
      return false;
    }
  }
  async function storeList(prefix){
    if(!fbReady) return [];
    try{
      var snap = await db.ref('data')
        .orderByKey()
        .startAt(prefix)
        .endAt(prefix + '\uf8ff')
        .once('value');
      var val = snap.val() || {};
      return Object.keys(val);
    }catch(e){
      return [];
    }
  }
  // Saves a reusable copy of the quiz to a shared library (used by FormWheel Battle)
  async function saveToLibrary(quizId, payload){
    if(!fbReady) return false;
    try{
      await db.ref('quizzes/' + quizId).set(payload);
      return true;
    }catch(e){
      return false;
    }
  }

  // ---------- local draft (temporary save) ----------
  var DRAFT_STORAGE_KEY = 'formwheel_quiz_drafts_v1';
  var draftAutosaveTimer = null;
  var currentDraftId = null;

  function loadLocalDrafts(){
    try{
      var raw = window.localStorage.getItem(DRAFT_STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      return (parsed && typeof parsed === 'object') ? parsed : {};
    }catch(e){
      return {};
    }
  }
  function saveLocalDrafts(drafts){
    try{
      window.localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(drafts));
      return true;
    }catch(e){
      return false;
    }
  }
  function upsertLocalDraft(id, data){
    var drafts = loadLocalDrafts();
    drafts[id] = data;
    return saveLocalDrafts(drafts);
  }
  function deleteLocalDraft(id){
    var drafts = loadLocalDrafts();
    delete drafts[id];
    saveLocalDrafts(drafts);
  }
  function listLocalDrafts(){
    var drafts = loadLocalDrafts();
    return Object.keys(drafts).map(function(id){
      var d = drafts[id];
      return {
        id: id,
        title: d.title || '',
        questionCount: (d.questions || []).length,
        timeLimit: d.timeLimit,
        savedAt: d.savedAt || 0
      };
    }).sort(function(a,b){ return b.savedAt - a.savedAt; });
  }

  function scheduleDraftAutosave(){
    var statusEl = document.getElementById('saveStatus');
    if(statusEl){
      statusEl.classList.add('saving');
      statusEl.querySelector('.stext').textContent = '저장 중...';
    }
    if(draftAutosaveTimer) clearTimeout(draftAutosaveTimer);
    draftAutosaveTimer = setTimeout(function(){
      persistCurrentDraft();
    }, 600);
  }
  function persistCurrentDraft(){
    if(!currentDraftId) currentDraftId = uid(10);
    var savedAt = Date.now();
    upsertLocalDraft(currentDraftId, {
      title: S.draftTitle || '',
      timeLimit: draftTimeLimit,
      questions: S.draftQuestions,
      savedAt: savedAt
    });
    var statusEl = document.getElementById('saveStatus');
    if(statusEl){
      statusEl.classList.remove('saving');
      statusEl.querySelector('.stext').textContent = '임시저장됨 · ' + timeAgoLabel(savedAt);
    }
  }

  // ---------- app state ----------
  var app = document.getElementById('app');
  var pollTimer = null;
  var questionTickTimer = null;
  var draftTimeLimit = 20;
  var lobbyPlayers = [];
  var hostAnswerCount = 0;

  var S = {
    screen: 'home',
    role: null,
    pin: null,
    playerId: null,
    playerName: '',
    meta: null,
    draftQuestions: null,
    draftTitle: '',
    lastAnswer: null,
    _qIndex: 0,
    _questionStartedAt: 0
  };

  function clearTimers(){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
    if(questionTickTimer){ clearInterval(questionTickTimer); questionTickTimer = null; }
    if(draftAutosaveTimer){ clearTimeout(draftAutosaveTimer); draftAutosaveTimer = null; }
  }

  function goto(screen){
    clearTimers();
    S.screen = screen;
    render();
  }

  function defaultQuestions(){
    return [
      { text: '다음 중 대한민국의 수도는 어디일까요?', choices: ['부산','서울','인천','대구'], correct: 1 },
      { text: '물의 화학식은 무엇일까요?', choices: ['CO2','O2','H2O','NaCl'], correct: 2 },
      { text: '태양계에서 가장 큰 행성은?', choices: ['지구','목성','화성','토성'], correct: 1 },
      { text: '1년은 총 며칠일까요? (평년 기준)', choices: ['364일','365일','366일','360일'], correct: 1 }
    ];
  }

  function navbarHtml(rightText){
    return '' +
      '<div class="navbar">' +
        '<button class="brand" id="brandBtn">' +
          '<span class="mark">F</span>' +
          '<span class="wordmark">FormWheel</span>' +
          '<span class="tag">Quiz</span>' +
        '</button>' +
        '<span class="nav-meta">' + (rightText || '') + '</span>' +
      '</div>';
  }
  function wireNavbar(){
    var b = document.getElementById('brandBtn');
    if(b) b.onclick = function(){ window.open(FORMWHEEL_HOME, '_blank'); };
  }

  // ---------- render router ----------
  function render(){
    if(!fbReady){
      app.innerHTML = navbarHtml('') +
        '<main><div class="stage"><div class="card">' +
          '<h1 class="title">연결에 문제가 있어요</h1>' +
          '<p class="sub">데이터베이스 연결을 초기화하지 못했어요. 인터넷 연결을 확인하고 새로고침 해주세요.</p>' +
        '</div></div></main>';
      wireNavbar();
      return;
    }
    if(S.screen === 'home') return renderHome();
    if(S.screen === 'host-setup') return renderHostSetup();
    if(S.screen === 'host-lobby') return renderHostLobby();
    if(S.screen === 'host-question') return renderHostQuestion();
    if(S.screen === 'host-reveal') return renderHostReveal();
    if(S.screen === 'host-final') return renderHostFinal();
    if(S.screen === 'join') return renderJoin();
    if(S.screen === 'player-lobby') return renderPlayerLobby();
    if(S.screen === 'player-question') return renderPlayerQuestion();
    if(S.screen === 'player-waiting') return renderPlayerWaiting();
    if(S.screen === 'player-reveal') return renderPlayerReveal();
    if(S.screen === 'player-final') return renderPlayerFinal();
  }

  // ---------- HOME ----------
  function renderHome(){
    var drafts = listLocalDrafts();
    var draftsHtml = drafts.length ? drafts.map(function(d){
      var titleLabel = d.title.trim() || '제목 없는 Quiz';
      return '' +
        '<div class="draft-card" data-id="' + d.id + '">' +
          '<div class="dinfo">' +
            '<div class="dtitle">' + escapeHtml(titleLabel) + '</div>' +
            '<div class="dmeta">문제 ' + d.questionCount + '개 · ' + timeAgoLabel(d.savedAt) + ' 저장됨</div>' +
          '</div>' +
          '<div class="dactions">' +
            '<button class="icon-btn resume-draft" data-id="' + d.id + '">이어하기</button>' +
            '<button class="icon-btn danger delete-draft" data-id="' + d.id + '">삭제</button>' +
          '</div>' +
        '</div>';
    }).join('') : '';

    app.innerHTML =
      navbarHtml('') +
      '<main><div class="stage">' +
        '<h1 class="title">Quiz 만들기</h1>' +
        '<p class="sub">각자 폰이나 PC로 접속해서 실시간으로 맞히는 퀴즈예요. 이 게임의 점수는 저장되지 않고, 창을 닫으면 사라져요.</p>' +
        draftsHtml +
        '<div class="home-choice">' +
          '<div class="home-card" id="pickHost"><h3>퀴즈 만들기</h3><p>문제를 준비하고 참가 코드를 발급해요. 큰 화면(발표용)에 띄워두세요.</p></div>' +
          '<div class="home-card" id="pickJoin"><h3>참가하기</h3><p>진행자에게 받은 코드를 입력하고 닉네임으로 들어가요.</p></div>' +
        '</div>' +
      '</div></main>';
    wireNavbar();
    document.getElementById('pickHost').onclick = function(){
      currentDraftId = null;
      S.draftQuestions = defaultQuestions();
      S.draftTitle = '';
      draftTimeLimit = 20;
      goto('host-setup');
    };
    document.getElementById('pickJoin').onclick = function(){ goto('join'); };

    document.querySelectorAll('.resume-draft').forEach(function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        var id = btn.dataset.id;
        var drafts = loadLocalDrafts();
        var d = drafts[id];
        if(!d) return;
        currentDraftId = id;
        S.draftQuestions = (d.questions && d.questions.length) ? d.questions : defaultQuestions();
        S.draftTitle = d.title || '';
        draftTimeLimit = d.timeLimit || 20;
        goto('host-setup');
      };
    });
    document.querySelectorAll('.delete-draft').forEach(function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        deleteLocalDraft(btn.dataset.id);
        renderHome();
      };
    });
  }

  // ---------- HOST: setup ----------
  function renderHostSetup(){
    var qs = S.draftQuestions;
    var timeSegHtml = [10,15,20,30].map(function(t){
      return '<div class="seg-btn ' + (t===draftTimeLimit?'active':'') + '" data-t="' + t + '">' + t + '초</div>';
    }).join('');

    app.innerHTML =
      navbarHtml('') +
      '<main><div class="stage">' +
        '<h1 class="title">문제 준비하기</h1>' +
        '<p class="sub">문제와 보기 4개, 정답을 정해주세요. 필요하면 문제를 더 추가하거나 지울 수 있어요.</p>' +
        '<div class="save-status" id="saveStatus"><span class="dot"></span><span class="stext">이 브라우저에 자동으로 임시저장돼요</span></div>' +
        '<div class="field"><label class="flabel">Quiz 제목</label><input type="text" id="quizTitleInput" maxlength="30" placeholder="예: 상식 퀴즈" value="' + escapeHtml(S.draftTitle || '') + '" /></div>' +

            '<input type="text" class="choice-input" data-qi="' + qi + '" data-ci="' + ci + '" value="' + escapeHtml(c) + '" placeholder="보기 ' + (ci+1) + '" />' +

        '</div>';
    }).join('');

    document.getElementById('timeSeg').querySelectorAll('.seg-btn').forEach(function(el){
      el.onclick = function(){ draftTimeLimit = parseInt(el.dataset.t, 10); renderHostSetup(); scheduleDraftAutosave(); };
    });
    qlist.querySelectorAll('.qtext-input').forEach(function(el){
      el.oninput = function(){ qs[+el.dataset.qi].text = el.value; scheduleDraftAutosave(); };
    });
    qlist.querySelectorAll('.choice-input').forEach(function(el){
      el.oninput = function(){ qs[+el.dataset.qi].choices[+el.dataset.ci] = el.value; scheduleDraftAutosave(); };
    });
    qlist.querySelectorAll('.correct-radio').forEach(function(el){
      el.onchange = function(){ qs[+el.dataset.qi].correct = +el.dataset.ci; scheduleDraftAutosave(); };
    });
    qlist.querySelectorAll('.remove-link').forEach(function(el){
      el.onclick = function(){ qs.splice(+el.dataset.qi, 1); renderHostSetup(); scheduleDraftAutosave(); };
    });

      qs.push({ text: '', choices: ['','','',''], correct: 0 });
      renderHostSetup();
      scheduleDraftAutosave();
    };

      S.draftTitle = this.value;
      scheduleDraftAutosave();
    };
    document.getElementById('saveDraftBtn').onclick = function(){
      persistCurrentDraft();
    };

    // if this draft was loaded (or already autosaved once), show its last-saved time
    if(currentDraftId){
      var drafts = loadLocalDrafts();
      var existing = drafts[currentDraftId];
      if(existing && existing.savedAt){
        var statusEl = document.getElementById('saveStatus');
        if(statusEl) statusEl.querySelector('.stext').textContent = '임시저장됨 · ' + timeAgoLabel(existing.savedAt);
      }
    }

    document.getElementById('createGame').onclick = async function(){
      var errEl = document.getElementById('createErr');
      for(var i=0;i<qs.length;i++){
        var q = qs[i];
        if(!q.text.trim() || q.choices.some(function(c){ return !c.trim(); })){
          errEl.textContent = '모든 문제와 보기 4개를 채워주세요.';
          return;
        }
      }
      errEl.textContent = '생성 중...';
      var pin = null;
      for(var a=0;a<8;a++){
        var candidate = genPin();
        var exists = await storeGet('qz:'+candidate+':meta');
        if(!exists){ pin = candidate; break; }
      }
      if(!pin){
        errEl.textContent = '코드 생성에 실패했어요. 다시 시도해주세요.';
        return;
      }
      S.pin = pin;
      S.meta = { questions: qs.map(function(q){ return { text: q.text, choices: q.choices.slice(), correct: q.correct }; }), timeLimit: draftTimeLimit };
      await storeSet('qz:'+pin+':meta', S.meta);
      await storeSet('qz:'+pin+':state', { phase: 'lobby', qIndex: -1, questionStartedAt: 0 });
      saveToLibrary(uid(10), {
        title: (S.draftTitle || '').trim() || '제목 없는 Quiz',
        questions: S.meta.questions,
        timeLimit: S.meta.timeLimit,
        createdAt: Date.now()
      });
      // 임시저장은 게임을 배포해도 삭제하지 않고 그대로 유지합니다.
      if(currentDraftId){
        persistCurrentDraft();
      }
      S.role = 'host';
      S._qIndex = 0;
      goto('host-lobby');
    };

  async function submitAnswer(choiceIdx){
    var qi = S._qIndex;
    var q = S.meta.questions[qi];
    document.querySelectorAll('#choiceGrid .choice-btn').forEach(function(b){
      b.disabled = true;
      if(+b.dataset.i !== choiceIdx) b.classList.add('dim');
      else b.classList.add('picked');
    });

    var elapsedSec = Math.min((Date.now() - S._questionStartedAt) / 1000, S.meta.timeLimit);
    var isCorrect = choiceIdx === q.correct;
    var speedRatio = Math.max(0, 1 - elapsedSec / S.meta.timeLimit);
    var points = isCorrect ? Math.round(500 + 500 * speedRatio) : 0;

    S.lastAnswer = { choice: choiceIdx, points: points, correct: isCorrect };
    await storeSet('qz:'+S.pin+':ans:'+qi+':'+S.playerId, { choice: choiceIdx, points: points, answeredAt: Date.now() });

    var me = await storeGet('qz:'+S.pin+':player:'+S.playerId);
    if(me){
      me.score = (me.score || 0) + points;
      await storeSet('qz:'+S.pin+':player:'+S.playerId, me);
    }

    setTimeout(function(){ if(S.screen === 'player-question') goto('player-waiting'); }, 500);
  }

  async function renderPlayerFinal(){
    app.innerHTML = navbarHtml('') + '<main><div class="stage"><p class="sub">최종 결과 불러오는 중...</p></div></main>';
    var myKey = 'qz:'+S.pin+':player:'+S.playerId;

    var players = [];
    for(var i=0;i<pKeys.length;i++){
      var v = await storeGet(pKeys[i]);
      if(v) players.push({ name: v.name, score: v.score, isMe: pKeys[i] === myKey });
    }
    players.sort(function(a,b){ return b.score - a.score; });
    var myRank = players.findIndex(function(p){ return p.isMe; }) + 1;

    var leadHtml = players.map(function(p,i){
      return '' +
        '<div class="lead-row ' + (p.isMe?'me':'') + '">' +
          '<span class="rank">' + (i+1) + '</span>' +
          '<span class="name">' + medalTag(i) + escapeHtml(p.name) + (p.isMe?' (나)':'') + '</span>' +
          '<span class="score">' + p.score + '</span>' +
        '</div>';
    }).join('');

    app.innerHTML =
      navbarHtml('') +
      '<main><div class="stage">' +
        '<div class="center-msg" style="margin-bottom:16px;padding:16px 0;">' +
          '<div class="big">🏁</div>' +
          '<h1 class="title">최종 순위 ' + myRank + '위</h1>' +
          '<p class="sub">수고하셨어요!</p>' +
        '</div>' +
        leadHtml +
      '</div></main>';
    wireNavbar();
  }

  // ---------- reset ----------
  function resetToHome(){
    clearTimers();
    currentDraftId = null;
    S.screen = 'home';
    S.role = null;
    S.pin = null;
    S.playerId = null;
    S.playerName = '';
    S.meta = null;
    S.draftQuestions = null;
    S.draftTitle = '';
    S.lastAnswer = null;
    S._qIndex = 0;
    render();
  }

  render();
})();
</script>
</body>
