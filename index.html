<details style="margin:12px auto;max-width:210px;text-align:center;font-size:10px;opacity:.45"><summary style="cursor:pointer">∙∙∙</summary><span>QUIZ-ECHO</span></details>

<!-- 세랜 대규모 개선: 독립형 도움말, 공유, 단축키. 게임 로직 및 데이터 저장은 변경하지 않음. -->
<style>
#seran-kit{max-width:820px;margin:22px auto;padding:0 16px;font:14px/1.55 system-ui,-apple-system,sans-serif;color:#263145;box-sizing:border-box}
#seran-kit *{box-sizing:border-box}
#seran-kit details{border:1px solid #d8ddec;border-radius:15px;background:#f8f9ff;padding:13px 16px;box-shadow:0 2px 8px #0000000a}
#seran-kit summary{cursor:pointer;font-weight:800;list-style:auto}
#seran-kit .seran-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#seran-kit button{appearance:none;border:1px solid #bcc5df;background:white;color:#263145;border-radius:9px;padding:9px 12px;font:700 13px system-ui;cursor:pointer;min-height:38px}
#seran-kit button:hover{background:#edf0ff}
#seran-kit button:focus-visible,#seran-kit summary:focus-visible{outline:3px solid #596dca;outline-offset:3px}
#seran-kit [role=status]{min-height:20px;color:#38548b;overflow-wrap:anywhere}
</style>
<aside id="seran-kit" aria-label="Quiz 플레이 도움말"><details id="seran-details"><summary>💡 Quiz 빠른 도움말 · 공유</summary><p id="seran-tip">시작하기 전에 퀴즈 문제와 선택지를 다시 확인해 보세요.</p><div class="seran-actions"><button type="button" id="seran-next">🎲 다음 팁</button><button type="button" id="seran-share">🔗 페이지 주소 복사</button></div><p role="status" aria-live="polite" id="seran-status"></p><small>단축키: <kbd>?</kbd> 도움말 열기/닫기 · <kbd>Esc</kbd> 닫기</small></details></aside>
<script>
(()=>{'use strict';
const tips=["시작하기 전에 퀴즈 문제와 선택지를 다시 확인해 보세요.","친구와 경쟁하고 싶다면 배틀 모드로 이동하세요.","긴 문제는 화면을 내려 끝까지 읽어 보세요."];let index=0;
const root=document.getElementById('seran-kit'),details=document.getElementById('seran-details'),tip=document.getElementById('seran-tip'),status=document.getElementById('seran-status');
root.querySelector('#seran-next').addEventListener('click',()=>{index=(index+1)%tips.length;tip.textContent=tips[index];status.textContent='팁 '+(index+1)+' / '+tips.length;});
root.querySelector('#seran-share').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);status.textContent='✅ 주소가 복사됐어요.';}catch{status.textContent='자동 복사가 제한됐어요. 브라우저 주소창에서 주소를 복사해 주세요.';}});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.isComposing||e.repeat||e.target?.closest('input,textarea,select,[contenteditable=true]'))return;if(e.key==='?'&&e.shiftKey){details.open=!details.open;}else if(e.key==='Escape'&&details.open){details.open=false;}});
})();
</script>

<style id="secol-navigation-style">#secol-scroll-top{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:9000;padding:11px 15px;border:2px solid currentColor;border-radius:999px;background:#fff;color:#202638;font:700 14px system-ui;box-shadow:0 3px 14px #0002;cursor:pointer}#secol-scroll-top[hidden]{display:none!important}#secol-scroll-top:focus-visible{outline:3px solid #ff8c28;outline-offset:3px}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}}</style>
<button type="button" id="secol-scroll-top" hidden aria-label="페이지 맨 위로 이동">↑ 맨 위로</button>
<script>(function(){const b=document.getElementById('secol-scroll-top');if(!b)return;let pending=false;function refresh(){pending=false;b.hidden=window.scrollY<420}addEventListener('scroll',()=>{if(!pending){pending=true;requestAnimationFrame(refresh)}},{passive:true});b.addEventListener('click',()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'}));refresh()})();</script>

<style id="secol-share-style">#secol-share-link{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:8000;border:1px solid #aab3c4;border-radius:999px;padding:9px 13px;background:#fff;color:#172033;font:600 13px system-ui;box-shadow:0 2px 10px #0002;cursor:pointer}#secol-share-link:focus-visible{outline:3px solid #e87920;outline-offset:3px}#secol-share-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}</style>
<button type="button" id="secol-share-link" aria-label="현재 프로젝트 링크 공유">🔗 공유</button><span id="secol-share-status" role="status" aria-live="polite"></span>
<script>(function(){const b=document.getElementById('secol-share-link'),status=document.getElementById('secol-share-status');if(!b||!status)return;b.addEventListener('click',async()=>{const url=location.origin+location.pathname;try{if(navigator.share){await navigator.share({title:document.title,url});status.textContent='공유 메뉴를 열었습니다.';return}if(navigator.clipboard&&isSecureContext){await navigator.clipboard.writeText(url);status.textContent='프로젝트 주소가 복사되었습니다.';b.textContent='✓ 복사됨';setTimeout(()=>b.textContent='🔗 공유',2000);return}window.prompt('프로젝트 주소를 복사하세요',url);status.textContent='주소를 확인하세요.'}catch(e){if(e.name!=='AbortError'){window.prompt('프로젝트 주소를 복사하세요',url);status.textContent='주소를 확인하세요.'}}})})();</script>
