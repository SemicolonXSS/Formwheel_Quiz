<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO // Quiz</title><link rel="icon" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg"><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at center top,#25284a,#080b15 65%);color:#e0e9fc;min-height:100vh}main{max-width:650px;margin:auto;padding:30px 18px}header{display:flex;justify-content:space-between;align-items:center;color:#a4c5dc;font-size:12px;letter-spacing:.16em}header a{color:#9cb5da;text-decoration:none}.card{border:1px solid #44557a;border-radius:18px;background:#0e1628ec;padding:26px;margin-top:30px;box-shadow:0 0 45px #3a6e9e19}.signal{color:#87ffc2;letter-spacing:.28em;font-size:11px}h1{letter-spacing:.2em;font-size:clamp(36px,9vw,64px);text-shadow:0 0 25px #a5bdff88}h2{line-height:1.6;font-size:20px}p{line-height:1.8;color:#aebcd5}button{width:100%;margin:7px 0;padding:15px;text-align:left;border:1px solid #52638c;border-radius:11px;background:#18243c;color:#f2f7ff;font:inherit;cursor:pointer}button:hover{background:#25395a}button:focus-visible{outline:3px solid #a4d5ff}.muted{color:#88a0bf;font-size:12px}.glitch{animation:fade .55s both}@keyframes fade{from{opacity:.25;filter:blur(4px)}to{opacity:1;filter:none}}.progress{height:6px;background:#29384d;border-radius:4px;margin-top:19px}.progress div{height:100%;background:#81cbd8;border-radius:4px;transition:width .25s}.hidden{display:none}#status{min-height:22px}a{color:#a0e3db}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main><header><a href="./">← QUIZ</a><span>FREQUENCY: UNKNOWN</span></header><section class="card glitch"><div class="signal">SIGNAL CONNECTED · ECHO</div><h1>ECHO</h1><p>메아리는 답을 반복하지 않는다. 그저 흔적을 남긴다.</p><div id="intro"><p>5개의 연결된 복원 로그. 정답을 맞히면 기록된 단서가 다음 질문의 열쇠가 된다. 만점일 때만 신호가 완성된다.</p><button id="start">신호 수신 시작 →</button></div><div id="game" class="hidden"><div class="muted" id="counter"></div><p class="muted" id="log" aria-live="polite"></p><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div id="answers"></div><p class="muted" id="status" role="status" aria-live="polite"></p></div><div id="end" class="hidden"><h2 id="result"></h2><p id="summary"></p><button id="retry">다시 연결하기</button><p><a id="secret" class="hidden" href="https://semicolonxss.github.io/Formwheel/secret/">Secret 도감 확인 →</a></p></div></section></main><script>
const Q=[
["[ECHO_01] 깨진 송신 로그에 RPUB가 남았다. ROT13으로 복원한 원래 호출명은?",["RCHO","ECHO","ECPQ","CUBR"],1,"CALLSIGN = ECHO"],
["[ECHO_02] 호출명의 첫 두 문자 E, C를 ASCII 16진수로 기록하라는 명령. 올바른 기록은?",["44 42","45 43","46 44","54 34"],1,"BYTES = 45 43"],
["[ECHO_03] 복원한 바이트 45 43을 ASCII 문자로 바꾼 뒤 순서를 뒤집으면 무엇이 남을까?",["EC","DE","CD","CE"],3,"MIRROR = CE"],
["[ECHO_04] 거울에서 얻은 두 문자 CE를 알파벳에서 각각 두 칸 앞으로 이동시키면?",["EG","DF","CG","GE"],0,"OFFSET = EG"],
["[ECHO_05] 마지막 검증. 지금까지의 CALLSIGN, MIRROR, OFFSET을 이 순서대로 하이픈(-)으로 연결하면?",["ECHO-EG-CE","RPUB-CE-EG","ECHO-CE-EG","ECHO-EC-EG"],2,"TRANSMISSION VERIFIED"]
];
let pos=0,score=0,locked=false,recovered=[];const $=s=>document.querySelector(s);
function normalize(s){return String(s).trim().toUpperCase().replace(/\s+/g,"");}
function question(){
 locked=false;
 $("#counter").textContent="SIGNAL "+String(pos+1).padStart(2,"0")+" / 05";
 $("#bar").style.width=(pos/Q.length*100)+"%";
 $("#question").textContent=Q[pos][0];
 $("#log").textContent=recovered.length?"RECOVERED LOG // "+recovered.join(" | "):"RECOVERED LOG // NO SIGNAL";
 const box=$("#answers");box.replaceChildren();
 const form=document.createElement("form");form.id="echo-answer-form";
 const label=document.createElement("label");label.setAttribute("for","echo-answer");label.textContent="복원한 답안 입력";
 const input=document.createElement("input");input.id="echo-answer";input.type="text";input.autocomplete="off";input.spellcheck=false;input.required=true;input.maxLength=64;input.placeholder="정답을 직접 입력하세요";
 input.style.cssText="display:block;width:100%;padding:15px;margin:10px 0;background:#0b1427;color:#fff;border:1px solid #60729e;border-radius:10px;font:inherit";
 const button=document.createElement("button");button.type="submit";button.textContent="신호 전송 →";
 form.append(label,input,button);form.onsubmit=e=>{e.preventDefault();choose(input.value)};
 box.append(form);$("#status").textContent="";
}
function choose(value){
 if(locked)return;
 const correct=Q[pos][1][Q[pos][2]];
 const good=normalize(value)===normalize(correct);
 locked=true;
 if(good){score++;recovered.push(Q[pos][3]);}
 $("#status").textContent=good?"SIGNAL ACCEPTED":"SIGNAL LOST";
 const submit=$("#echo-answer-form button");if(submit)submit.disabled=true;
 const input=$("#echo-answer");if(input)input.disabled=true;
 setTimeout(()=>{pos++;if(pos<Q.length)question();else finish()},750);
}
function finish(){$("#game").classList.add("hidden");$("#end").classList.remove("hidden");$("#bar").style.width="100%";const won=score===Q.length;$("#result").textContent=won?"ECHO // PERFECT":"TRANSMISSION INCOMPLETE";$("#summary").textContent=score+" / "+Q.length+" · "+(won?"모든 신호를 복원했어. Secret의 비밀을 발견했어.":"흩어진 신호를 다시 연결해 봐.");$("#secret").classList.toggle("hidden",!won);if(won){try{const key="formwheel.secret.v1",v=JSON.parse(localStorage.getItem(key)||"{}");v[6]={date:new Date().toLocaleDateString("ko-KR"),source:"quiz-echo"};localStorage.setItem(key,JSON.stringify(v))}catch{$("#summary").textContent+=" 단, 브라우저 저장이 차단돼 기록을 저장하지 못했어."}}}
function start(){pos=0;score=0;recovered=[];$("#intro").classList.add("hidden");$("#end").classList.add("hidden");$("#game").classList.remove("hidden");question()}
$("#start").onclick=start;$("#retry").onclick=start;
</script></body></html>
