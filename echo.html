<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO // Quiz</title><link rel="icon" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg"><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at center top,#25284a,#080b15 65%);color:#e0e9fc;min-height:100vh}main{max-width:650px;margin:auto;padding:30px 18px}header{display:flex;justify-content:space-between;align-items:center;color:#a4c5dc;font-size:12px;letter-spacing:.16em}header a{color:#9cb5da;text-decoration:none}.card{border:1px solid #44557a;border-radius:18px;background:#0e1628ec;padding:26px;margin-top:30px;box-shadow:0 0 45px #3a6e9e19}.signal{color:#87ffc2;letter-spacing:.28em;font-size:11px}h1{letter-spacing:.2em;font-size:clamp(36px,9vw,64px);text-shadow:0 0 25px #a5bdff88}h2{line-height:1.6;font-size:20px}p{line-height:1.8;color:#aebcd5}button{width:100%;margin:7px 0;padding:15px;text-align:left;border:1px solid #52638c;border-radius:11px;background:#18243c;color:#f2f7ff;font:inherit;cursor:pointer}button:hover{background:#25395a}button:focus-visible{outline:3px solid #a4d5ff}.muted{color:#88a0bf;font-size:12px}.glitch{animation:fade .55s both}@keyframes fade{from{opacity:.25;filter:blur(4px)}to{opacity:1;filter:none}}.progress{height:6px;background:#29384d;border-radius:4px;margin-top:19px}.progress div{height:100%;background:#81cbd8;border-radius:4px;transition:width .25s}.hidden{display:none}#status{min-height:22px}a{color:#a0e3db}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main><header><a href="./">← QUIZ</a><span>FREQUENCY: UNKNOWN</span></header><section class="card glitch"><div class="signal">SIGNAL CONNECTED · ECHO</div><h1>ECHO</h1><p>메아리는 답을 반복하지 않는다. 그저 흔적을 남긴다.</p><div id="intro"><p>총 5개의 질문. 하나라도 틀리면 신호는 끊어진다. 다시 도전할 수 있다.</p><button id="start">신호 수신 시작 →</button></div><div id="game" class="hidden"><div class="muted" id="counter"></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div id="answers"></div><p class="muted" id="status" role="status" aria-live="polite"></p></div><div id="end" class="hidden"><h2 id="result"></h2><p id="summary"></p><button id="retry">다시 연결하기</button><p><a id="secret" class="hidden" href="https://semicolonxss.github.io/Formwheel/secret/">Secret 도감 확인 →</a></p></div></section></main><script>
const Q=[
["[ECHO_01] 응답이 세 번 되돌아왔다. 최초의 신호는?","··· / ·· / ·",["첫 번째 ···","두 번째 ··","세 번째 ·","신호 없음"],0],
["[ECHO_02] 전송 로그: 01000101 01000011 01001000 01001111. ASCII로 해석한 단어는?",["ERROR","ECHO","QUIZ","ZERO"],1],
["[ECHO_03] 같은 메시지가 4초마다 반복된다. 00:00, 00:04, 00:08 다음은?",["00:09","00:10","00:12","00:16"],2],
["[ECHO_04] 로그에 'NORTH → ORTH → RTH → TH'가 기록됐다. 사라지는 것은?",["마지막 문자","첫 번째 문자","모든 모음","숫자"],1],
["[ECHO_05] 마지막 신호: E C H O. 이 네 문자의 역순은?",["OHCE","OEHC","ECHO","HECO"],0]
];
let pos=0,score=0,locked=false;const $=s=>document.querySelector(s);
function question(){locked=false;$("#counter").textContent="SIGNAL "+String(pos+1).padStart(2,"0")+" / 05";$("#bar").style.width=(pos/Q.length*100)+"%";$("#question").textContent=Q[pos][0];const box=$("#answers");box.replaceChildren();Q[pos][2].forEach((a,i)=>{const b=document.createElement("button");b.textContent=String(i+1).padStart(2,"0")+"  "+a;b.onclick=()=>choose(i);box.append(b)});$("#status").textContent=""}
function choose(i){if(locked)return;locked=true;const good=i===Q[pos][3];if(good)score++;$("#status").textContent=good?"SIGNAL ACCEPTED":"SIGNAL LOST";[...$("#answers").children].forEach(b=>b.disabled=true);setTimeout(()=>{pos++;if(pos<Q.length)question();else finish()},560)}
function finish(){$("#game").classList.add("hidden");$("#end").classList.remove("hidden");$("#bar").style.width="100%";const won=score===Q.length;$("#result").textContent=won?"ECHO // PERFECT":"TRANSMISSION INCOMPLETE";$("#summary").textContent=score+" / "+Q.length+" · "+(won?"모든 신호를 복원했어. Secret의 비밀을 발견했어.":"흩어진 신호를 다시 연결해 봐.");$("#secret").classList.toggle("hidden",!won);if(won){try{const key="formwheel.secret.v1",v=JSON.parse(localStorage.getItem(key)||"{}");v[6]={date:new Date().toLocaleDateString("ko-KR"),source:"quiz-echo"};localStorage.setItem(key,JSON.stringify(v))}catch{$("#summary").textContent+=" 단, 브라우저 저장이 차단돼 기록을 저장하지 못했어."}}}
function start(){pos=0;score=0;$("#intro").classList.add("hidden");$("#end").classList.add("hidden");$("#game").classList.remove("hidden");question()}
$("#start").onclick=start;$("#retry").onclick=start;
</script></body></html>
